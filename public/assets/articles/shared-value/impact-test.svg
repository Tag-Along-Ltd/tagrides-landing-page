<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>The original trip, added driving and the rider’s alternative.</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2EB"/><svg x="64" y="55" width="100" height="60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" fill="none" role="img" aria-label="Tag Rides mark">
  <title>Tag Rides — Stronger Together mark</title>
  <defs>
    <mask id="cut-teal">
      <rect width="100" height="60" fill="white"/>
      <circle cx="65" cy="30" r="22" fill="black"/>
    </mask>
  </defs>
  <!-- Teal ring (full) -->
  <circle cx="35" cy="30" r="22" stroke="#008080" stroke-width="6"/>
  <!-- Amber ring, masked to read as interlocked behind the teal -->
  <g mask="url(#cut-teal)">
    <circle cx="65" cy="30" r="22" stroke="#F59E0B" stroke-width="6"/>
  </g>
  <!-- Teal arc back on top for the over/under interlace -->
  <path d="M 56 17 A 22 22 0 0 1 56 43" stroke="#008080" stroke-width="6" stroke-linecap="round"/>
</svg>
<text x="190" y="95" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#52635F" font-weight="700">SHARED VALUE</text><text x="64" y="215" font-family="DejaVu Sans,sans-serif" font-size="55" fill="#102E2C" font-weight="700">A fuller car is only the beginning.</text><rect x="64" y="295" width="470" height="370" rx="26" fill="#E1EAE3"/><text x="96" y="365" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#008080" font-weight="700">01</text><text x="96" y="437" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#102E2C" font-weight="700">The original trip</text><text x="96" y="510" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#52635F" font-weight="400">Was the driver</text><text x="96" y="554" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#52635F" font-weight="400">travelling anyway?</text><rect x="574" y="295" width="470" height="370" rx="26" fill="#E1EAE3"/><text x="606" y="365" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#008080" font-weight="700">02</text><text x="606" y="437" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#102E2C" font-weight="700">The added distance</text><text x="606" y="510" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#52635F" font-weight="400">How much extra</text><text x="606" y="554" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#52635F" font-weight="400">driving did pickup add?</text><rect x="1084" y="295" width="470" height="370" rx="26" fill="#E1EAE3"/><text x="1116" y="365" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#008080" font-weight="700">03</text><text x="1116" y="437" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#102E2C" font-weight="700">The alternative</text><text x="1116" y="510" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#52635F" font-weight="400">What would the rider</text><text x="1116" y="554" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#52635F" font-weight="400">otherwise have used?</text><text x="64" y="750" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#52635F" font-weight="400">Measure the difference made by the shared journey.</text><path d="M64 800 H1536" fill="none" stroke="#D3D9D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="64" y="853" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#102E2C" font-weight="700">Their route. Your ride.</text><text x="1030" y="853" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#52635F" font-weight="400">TagRides · Editorial illustration</text></svg>