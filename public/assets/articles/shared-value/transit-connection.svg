<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>A shared leg connects a neighbourhood to public transport.</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2EB"/><svg x="64" y="55" width="100" height="60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" fill="none" role="img" aria-label="Tag Rides mark">
  <title>Tag Rides — Stronger Together mark</title>
  <defs>
    <mask id="cut-teal">
      <rect width="100" height="60" fill="white"/>
      <circle cx="65" cy="30" r="22" fill="black"/>
    </mask>
  </defs>
  <!-- Teal ring (full) -->
  <circle cx="35" cy="30" r="22" stroke="#008080" stroke-width="6"/>
  <!-- Amber ring, masked to read as interlocked behind the teal -->
  <g mask="url(#cut-teal)">
    <circle cx="65" cy="30" r="22" stroke="#F59E0B" stroke-width="6"/>
  </g>
  <!-- Teal arc back on top for the over/under interlace -->
  <path d="M 56 17 A 22 22 0 0 1 56 43" stroke="#008080" stroke-width="6" stroke-linecap="round"/>
</svg>
<text x="190" y="95" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#52635F" font-weight="700">SHARED VALUE</text><text x="64" y="215" font-family="DejaVu Sans,sans-serif" font-size="55" fill="#102E2C" font-weight="700">A shared leg. A useful connection.</text><path d="M190 450 H780" fill="none" stroke="#008080" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M820 450 H1400" fill="none" stroke="#F59E0B" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><circle cx="190" cy="450" r="25" fill="#102E2C"/><circle cx="190" cy="450" r="12" fill="#F5F2EB"/><circle cx="800" cy="450" r="25" fill="#102E2C"/><circle cx="800" cy="450" r="12" fill="#F5F2EB"/><circle cx="1400" cy="450" r="25" fill="#102E2C"/><circle cx="1400" cy="450" r="12" fill="#F5F2EB"/><text x="100" y="350" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#102E2C" font-weight="700">Neighbourhood</text><text x="100" y="560" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#52635F" font-weight="400">A starting point</text><text x="620" y="350" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#102E2C" font-weight="700">Interchange</text><text x="620" y="560" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#52635F" font-weight="400">Connect with transit</text><text x="1220" y="350" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#102E2C" font-weight="700">Destination</text><text x="1220" y="560" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#52635F" font-weight="400">Continue the trip</text><text x="290" y="680" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#008080" font-weight="700">Suitable shared leg</text><text x="1010" y="680" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#946000" font-weight="700">Public transport</text><text x="64" y="758" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#52635F" font-weight="400">An illustrative use case, not an announced service or integration.</text><path d="M64 800 H1536" fill="none" stroke="#D3D9D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="64" y="853" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#102E2C" font-weight="700">Their route. Your ride.</text><text x="1030" y="853" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#52635F" font-weight="400">TagRides · Editorial illustration</text></svg>