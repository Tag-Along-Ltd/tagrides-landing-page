dth="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="1290" y="560" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#102E2C" font-weight="700">Available</text><text x="64" y="715" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#102E2C" font-weight="700">4 offered places − 2 boarded − 1 outside the app = 1 available</text><path d="M64 800 H1536" fill="none" stroke="#D3D9D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="64" y="853" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#102E2C" font-weight="700">Their route. Your ride.</text><text x="1030" y="853" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#52635F" font-weight="400">TagRides · Editorial illustration</text></svg>