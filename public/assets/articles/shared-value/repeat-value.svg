<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Repeat riders, worthwhile earnings, dependable pickups and sustainable costs.</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2EB"/><svg x="64" y="55" width="100" height="60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" fill="none" role="img" aria-label="Tag Rides mark">
  <title>Tag Rides — Stronger Together mark</title>
  <defs>
    <mask id="cut-teal">
      <rect width="100" height="60" fill="white"/>
      <circle cx="65" cy="30" r="22" fill="black"/>
    </mask>
  </defs>
  <!-- Teal ring (full) -->
  <circle cx="35" cy="30" r="22" stroke="#008080" stroke-width="6"/>
  <!-- Amber ring, masked to read as interlocked behind the teal -->
  <g mask="url(#cut-teal)">
    <circle cx="65" cy="30" r="22" stroke="#F59E0B" stroke-width="6"/>
  </g>
  <!-- Teal arc back on top for the over/under interlace -->
  <path d="M 56 17 A 22 22 0 0 1 56 43" stroke="#008080" stroke-width="6" stroke-linecap="round"/>
</svg>
<text x="190" y="95" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#52635F" font-weight="700">SHARED VALUE</text><text x="64" y="215" font-family="DejaVu Sans,sans-serif" font-size="56" fill="#102E2C" font-weight="700">A service worth choosing again.</text><rect x="64" y="290" width="720" height="190" rx="25" fill="#E1EAE3"/><text x="94" y="358" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#102E2C" font-weight="700">Riders return</text><text x="94" y="417" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#52635F" font-weight="400">At ordinary fares</text><rect x="829" y="290" width="720" height="190" rx="25" fill="#E1EAE3"/><text x="859" y="358" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#102E2C" font-weight="700">Drivers earn</text><text x="859" y="417" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#52635F" font-weight="400">After relevant costs</text><rect x="64" y="510" width="720" height="190" rx="25" fill="#E1EAE3"/><text x="94" y="578" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#102E2C" font-weight="700">Pickups work</text><text x="94" y="637" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#52635F" font-weight="400">At useful times and places</text><rect x="829" y="510" width="720" height="190" rx="25" fill="#E1EAE3"/><text x="859" y="578" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#102E2C" font-weight="700">The service lasts</text><text x="859" y="637" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#52635F" font-weight="400">With costs it can support</text><path d="M64 800 H1536" fill="none" stroke="#D3D9D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="64" y="853" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#102E2C" font-weight="700">Their route. Your ride.</text><text x="1030" y="853" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#52635F" font-weight="400">TagRides · Editorial illustration</text></svg>