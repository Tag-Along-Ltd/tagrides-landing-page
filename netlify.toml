[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SITE_URL = "https://tagrider.com"
  NEXT_PUBLIC_ALLOWED_ORIGIN = "https://tagrider.com"

[[redirects]]
  from = "/brand-kit"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/brand-kit/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/pitch/ai-poc"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/pitch/ai-poc/*"
  to = "/404"
  status = 404
  force = true
